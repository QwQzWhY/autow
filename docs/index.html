<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<title>AutoW · 待办</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<header class="topbar">
  <div class="topbar__row">
    <h1>待办</h1>
    <div class="topbar__actions">
      <a class="icon-btn icon-btn--text" href="qq.html" title="QQ 接入" aria-label="QQ 接入">QQ</a>
      <button id="refresh" class="icon-btn" title="刷新" aria-label="刷新">↻</button>
    </div>
  </div>
  <p class="topbar__meta" id="meta">加载中…</p>
</header>

<nav class="filters" id="filters">
  <button class="filter is-active" data-view="open">待办</button>
  <button class="filter" data-view="soon">3 天内</button>
  <button class="filter" data-view="done">已完成</button>
  <button class="filter" data-view="all">全部</button>
</nav>

<main id="list" class="list">
  <p class="empty">加载中…</p>
</main>

<footer class="footer">
  <span id="footer-note"></span>
</footer>

<button class="fab" id="fab" type="button" aria-label="新建待办">＋</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__card">
    <div class="sheet__head">
      <strong>新建待办</strong>
      <button class="icon-btn" id="sheet-close" type="button" aria-label="关闭">×</button>
    </div>

    <div class="seg" id="compose-mode">
      <button class="seg__item is-active" type="button" data-mode="note">粘贴通知</button>
      <button class="seg__item" type="button" data-mode="manual">手动填写</button>
    </div>

    <div id="note-form">
      <p class="hint">把通知原文整段粘进来，大模型自己读截止时间、地点和要做什么。</p>
      <textarea id="note-text" rows="6" placeholder="例如：@全体成员 申请困难认证的同学请于明天中午十二点前在学工系统提交材料…"></textarea>
      <button class="btn btn--primary" id="note-submit" type="button">交给大模型识别</button>
    </div>

    <div id="manual-form" hidden>
      <label class="field"><span>要做什么</span>
        <input id="manual-title" type="text" placeholder="例如：去图书馆还书"></label>
      <label class="field"><span>截止时间（可留空）</span>
        <input id="manual-due" type="datetime-local"></label>
      <label class="field"><span>优先级</span>
        <select id="manual-priority">
          <option value="normal">普通</option>
          <option value="high">重要</option>
          <option value="low">不急</option>
        </select></label>
      <label class="field"><span>备注（可留空）</span>
        <input id="manual-detail" type="text" placeholder="补充说明"></label>
      <label class="field"><span>参加方式</span>
        <span class="checkline"><input id="manual-nomination" type="checkbox">
          要先经学院推荐或选拔才能参加（会单独排在底部）</span></label>
      <button class="btn btn--primary" id="manual-submit" type="button">创建</button>
    </div>

    <p class="result" id="compose-result"></p>
  </div>
</div>

<div class="undo" id="undo" hidden>
  <span id="undo-text"></span>
  <button type="button" id="undo-btn">撤销</button>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js?v=9"></script>
</body>
</html>
