name: 扫描通知

# 每小时自动跑一次，抓学院官网和学校新闻网的通知。
#
# QQ 群消息走的是另一个 workflow（qq.yml），因为它不需要浏览器，
# 可以跑得快得多。两者共用同一个 concurrency 组，避免提交打架。
#
# 想改频率就改这个 cron。学校的通知一天也就几条，每小时已经足够；
# 再密只会给你的账号和学校服务器增加无谓的负担。
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  # 改了爬虫代码就自动跑一次，算是烟囱测试。只盯代码路径，不带 data/ 和
  # docs/data/，否则这个 workflow 自己提交的数据会把它再触发一遍，无限循环。
  push:
    paths:
      - "autow/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

# 两次运行不要重叠，否则提交会打架
concurrency:
  group: autow-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取通知
        env:
          # 云端用 Playwright 自带的 Chromium，不用系统 Chrome
          AUTOW_BROWSER_CHANNEL: ""
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m autow run --skip-analyzed --pages 1

      - name: 提交结果
        # 即使抓取那一步因为配置错误退出，也要把健康状态提交上去，
        # 否则"为什么失败"只能去翻需要登录才能下载的 CI 日志。
        if: always()
        run: |
          git config user.name "autow-bot"
          git config user.email "autow-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 更新待办 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
